function reset(){editing=null;$('form').reset();$('type').value='Podstatné jméno';toggle();$('formTitle').textContent='Nové slovíčko';$('saveBtn').textContent='Uložit slovíčko';$('clips').innerHTML=''}$('form').onsubmit=e=>{e.preventDefault();let c=$('type').value==='Sloveso'?Object.fromEntries(['io','tu','lui','noi','voi','loro'].map(x=>[x,$(x).value])):null,d={word:$('word').value.trim(),translation:$('translation').value.trim(),type:$('type').value,gender:$('gender').value,article:$('article').value,plural:$('plural').value,isIsc:$('isc').checked,conjugation:c,image:$('image').value,note:$('note').value};if(editing){let i=words.findIndex(w=>w.id===editing);words[i]={...words[i],...d}}else words.push({id:crypto.randomUUID(),...d,score:0});save();reset();render();next();toast('Uloženo')};function edit(id){let w=words.find(x=>x.id===id);editing=id;for(let k of ['word','translation','gender','article','plural','image','note'])$(k).value=w[k]||'';$('type').value=w.type;$('isc').checked=!!w.isIsc;let c=w.conjugation||{};['io','tu','lui','noi','voi','loro'].forEach(x=>$(x).value=c[x]||'');toggle();$('formTitle').textContent='Upravit slovíčko';$('saveBtn').textContent='Uložit změny';document.querySelector('[data-tab=add]').click()}
