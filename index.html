<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6d4aff"><link rel="manifest" href="manifest.webmanifest"><title>Linguo v8</title><style>
:root{--p:#6d4aff;--bg:#f6f4ff;--line:#e4def5;--text:#25194f;--muted:#706989;--ok:#16865b;--bad:#c94c58}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#ebe7ff,#faf9ff 40%);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.app{max-width:720px;margin:auto;padding:16px 14px 80px}h1{font-size:1.55rem;margin:5px 0}.small{font-size:.84rem;color:var(--muted)}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:16px 0}.tabs button,.btn,input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--text)}.tabs button{padding:10px 3px;border:0}.tabs button.active,.primary{background:var(--p);color:#fff}.panel{display:none}.panel.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;margin:10px 0}.row,.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:.86rem;margin-bottom:5px}input,select,textarea,.btn{width:100%;padding:12px}.btn{font-weight:700;cursor:pointer}.flash{min-height:340px;padding:22px;border-radius:28px;background:linear-gradient(145deg,#fff,#e7e0ff);display:flex;flex-direction:column;justify-content:center;text-align:center;box-shadow:0 12px 35px #6044d31c}.word{font-size:clamp(2rem,11vw,4.4rem);font-weight:800;margin:20px 0 8px;overflow-wrap:anywhere}.answer{font-size:1.5rem;font-weight:700;color:var(--p)}.clip{display:none;width:130px;height:100px;object-fit:contain;background:#fff;border-radius:15px;padding:5px;margin:8px auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.good{background:var(--ok);color:#fff}.bad{color:var(--bad)}.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}.stats b{font-size:1.35rem}.list{display:grid;gap:8px}.item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px}.danger{border:0;background:none;color:var(--bad);font-size:1.3rem}.clip-results{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.clip-results img{width:100%;height:88px;object-fit:contain;background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px}.clip-results img.selected{border-color:var(--p)}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#241653;color:#fff;padding:11px 15px;border-radius:12px;display:none;z-index:4}.file{display:block;border:1px dashed var(--p);border-radius:13px;padding:12px;text-align:center}.link{display:block;text-align:center;color:var(--p);margin:14px}.native{display:none}@media(max-width:480px){.row,.filters{grid-template-columns:1fr}.tabs button{font-size:.78rem}}
</style></head><body><main class="app"><h1>📚 Linguo v8</h1><div class="small">Čeština ↔ italština, časování a kliparty</div><nav class="tabs"><button class="active" data-tab="learn">Učení</button><button data-tab="words">Slovíčka</button><button data-tab="add">Přidat</button><button data-tab="backup">Záloha</button></nav>
<section id="learn" class="panel active"><div class="filters"><select id="learnType"></select><select id="direction"><option value="it-cs">Italština → čeština</option><option value="cs-it">Čeština → italština</option><option value="random">Náhodně oba směry</option></select></div><div class="stats card"><div><b id="count">0</b><div class="small">slov</div></div><div><b id="known">0</b><div class="small">zvládnuto</div></div><div><b id="streak">0</b><div class="small">série</div></div></div><div class="flash" id="flash"><div class="small" id="meta"></div><img id="cardClip" class="clip" alt="Klipart"><div class="word" id="front">Přidej první slovo</div><div class="answer" id="back"></div><div class="small" id="hint">Klepni na kartičku</div></div><div class="actions"><button id="again" class="btn bad">Ještě procvičit</button><button id="know" class="btn good">Umím</button></div><button id="speak" class="btn" style="margin-top:9px">🔊 Italská výslovnost</button><a id="dict" class="link" target="_blank">Otevřít slovník ↗</a></section>
<section id="words" class="panel"><div class="filters"><input id="search" placeholder="Hledat"><select id="listType"></select></div><div id="wordList" class="list"></div></section>
<section id="add" class="panel"><form id="form" class="card"><h2>Nové slovíčko</h2><div class="field"><label>Automatické doplnění bez API klíče</label><div class="row"><input id="smart" placeholder="České nebo italské slovo"><select id="smartLang"><option value="auto">Rozpoznat jazyk</option><option value="cs">Zadávám česky</option><option value="it">Zadávám italsky</option></select></div><button type="button" id="autoFill" class="btn primary" style="margin-top:8px">Přeložit a doplnit údaje</button><div id="status" class="small" style="margin-top:6px">Vyžaduje internet. Výsledek před uložením zkontroluj.</div></div><div class="row"><div class="field"><label>Italské slovo *</label><input id="word" required></div><div class="field"><label>Český překlad *</label><input id="translation" required></div></div><div class="field"><label>Slovní druh</label><select id="type"></select></div><div id="nounBox" class="field"><label>Podstatné jméno</label><div class="row"><select id="gender"><option value="">Rod neurčen</option><option value="m">Mužský rod</option><option value="f">Ženský rod</option></select><input id="article" placeholder="Člen: il / lo / la / l'"></div><input id="plural" placeholder="Množné číslo" style="margin-top:8px"></div><div id="verbBox" class="field"><label>Časování přítomného času</label><label class="small"><input id="isc" type="checkbox" style="width:auto"> Sloveso typu -isc-</label><div class="row"><input id="io" placeholder="io"><input id="tu" placeholder="tu"><input id="lui" placeholder="Lui/Lei"><input id="noi" placeholder="noi"><input id="voi" placeholder="voi"><input id="loro" placeholder="loro"></div><button type="button" id="conjugate" class="btn" style="margin-top:8px">Doplnit časování</button></div><div class="field"><label>Klipart ke kartičce</label><button type="button" id="findClip" class="btn">Najít SVG kliparty</button><div id="clipResults" class="clip-results" style="margin-top:8px"></div><label class="file" style="margin-top:8px">Nahrát vlastní SVG/PNG/WebP<input id="clipFile" type="file" accept="image/svg+xml,image/png,image/webp" hidden></label><input id="image" readonly placeholder="Vybraný klipart" style="margin-top:8px"><button type="button" id="removeClip" class="btn" style="display:none;margin-top:8px">Odebrat klipart</button></div><div class="field"><label>Poznámka</label><textarea id="note" rows="2"></textarea></div><button class="btn primary">Uložit slovíčko</button></form></section>
<section id="backup" class="panel"><div class="card"><button id="exportJson" class="btn primary">Stáhnout JSON zálohu</button><button id="exportCsv" class="btn" style="margin-top:8px">Stáhnout CSV</button><label class="file" style="margin-top:8px">Importovat JSON<input id="importFile" type="file" accept=".json" hidden></label></div></section></main><div id="toast" class="toast"></div>
<script>
const TYPES=['Všechny slovní druhy','Podstatné jméno','Sloveso','Přídavné jméno','Příslovce','Zájmeno','Předložka','Spojka','Fráze','Ostatní'];const $=x=>document.getElementById(x);let words=JSON.parse(localStorage.getItem('linguo7')||'[]'),current=null,reverse=false,revealed=false,editingId=null,series=Number(localStorage.getItem('linguo7streak')||0);const save=()=>localStorage.setItem('linguo7',JSON.stringify(words));function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1900)}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
['learnType','listType','type'].forEach(id=>$(id).innerHTML=TYPES.map((x,i)=>(id==='type'&&i===0)?'':`<option>${x}</option>`).join(''));$('type').value='Podstatné jméno';document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});
const IRR={essere:['sono','sei','è','siamo','siete','sono'],avere:['ho','hai','ha','abbiamo','avete','hanno'],andare:['vado','vai','va','andiamo','andate','vanno'],fare:['faccio','fai','fa','facciamo','fate','fanno'],stare:['sto','stai','sta','stiamo','state','stanno'],dare:['do','dai','dà','diamo','date','danno'],dire:['dico','dici','dice','diciamo','dite','dicono'],venire:['vengo','vieni','viene','veniamo','venite','vengono'],uscire:['esco','esci','esce','usciamo','uscite','escono'],bere:['bevo','bevi','beve','beviamo','bevete','bevono'],sapere:['so','sai','sa','sappiamo','sapete','sanno'],potere:['posso','puoi','può','possiamo','potete','possono'],volere:['voglio','vuoi','vuole','vogliamo','volete','vogliono'],dovere:['devo','devi','deve','dobbiamo','dovete','devono']};function conjugation(v,isc=false){v=v.toLowerCase().trim();let a=IRR[v],s;if(a)return a;if(v.endsWith('are')){s=v.slice(0,-3);a=['o','i','a','iamo','ate','ano']}else if(v.endsWith('ere')){s=v.slice(0,-3);a=['o','i','e','iamo','ete','ono']}else if(v.endsWith('ire')){s=v.slice(0,-3);a=isc?['isco','isci','isce','iamo','ite','iscono']:['o','i','e','iamo','ite','ono']}else return null;return a.map(x=>s+x)}function fillConj(){let a=conjugation($('word').value,$('isc').checked);if(!a)return toast('Infinitiv nebyl rozpoznán');['io','tu','lui','noi','voi','loro'].forEach((x,i)=>$(x).value=a[i])}$('conjugate').onclick=fillConj;$('isc').onchange=fillConj;$('word').onblur=()=>{if($('type').value==='Sloveso')fillConj()};function toggleBoxes(){$('nounBox').style.display=$('type').value==='Podstatné jméno'?'block':'none';$('verbBox').style.display=$('type').value==='Sloveso'?'block':'none'}$('type').onchange=toggleBoxes;toggleBoxes();
function nounGuess(w){let x=w.toLowerCase(),g=x.endsWith('a')?'f':x.endsWith('o')?'m':'',p=x;if(x.endsWith('a'))p=x.slice(0,-1)+'e';else if(x.endsWith('o')||x.endsWith('e'))p=x.slice(0,-1)+'i';let art=/^[aeiou]/.test(x)?"l'":g==='f'?'la':g==='m'?'il':'';return{gender:g,plural:p,article:art}}async function translate(q,from,to){let r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair='+from+'|'+to),j=await r.json();let t=(j.responseData?.translatedText||'').trim();if(!r.ok||!t)throw Error();return t}async function meta(w){let fallback=nounGuess(w);try{let r=await fetch('https://it.wiktionary.org/w/api.php?action=parse&page='+encodeURIComponent(w)+'&prop=wikitext&format=json&origin=*'),j=await r.json(),t=j.parse?.wikitext?.['*']||'',l=t.toLowerCase(),type=/verbo/.test(l)?'Sloveso':/sostantivo|nome comune/.test(l)?'Podstatné jméno':/aggettivo/.test(l)?'Přídavné jméno':/avverbio/.test(l)?'Příslovce':(/are$|ere$|ire$/.test(w)?'Sloveso':'Ostatní');return{type,...fallback}}catch{return{type:/are$|ere$|ire$/.test(w)?'Sloveso':'Ostatní',...fallback}}}$('autoFill').onclick=async()=>{let q=$('smart').value.trim();if(!q)return toast('Zadej slovo');let from=$('smartLang').value;if(from==='auto')from=/[áčďéěíňóřšťúůýž]/i.test(q)?'cs':'it';$('status').textContent='Překládám a ověřuji údaje…';try{let tr=await translate(q,from,from==='cs'?'it':'cs'),it=(from==='it'?q:tr).toLowerCase(),cs=(from==='cs'?q:tr).toLowerCase(),m=await meta(it);$('word').value=it;$('translation').value=cs;$('type').value=m.type;$('gender').value=m.gender;$('article').value=m.article;$('plural').value=m.plural;toggleBoxes();if(m.type==='Sloveso')fillConj();$('status').textContent='Doplněno. Překlad a gramatické údaje zkontroluj.'}catch{$('status').textContent='Doplnění selhalo. Zkus ruční volbu jazyka nebo doplň slovo ručně.';toast('Automatické doplnění se nezdařilo')}};
$('findClip').onclick=async()=>{let q=$('word').value.trim()||$('smart').value.trim();if(!q)return toast('Nejprve zadej slovo');$('clipResults').innerHTML='<div class="small">Hledám…</div>';try{let u='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q+' icon clipart filetype:svg')+'&gsrnamespace=6&gsrlimit=9&prop=imageinfo&iiprop=url&iiurlwidth=240&format=json&origin=*',r=await fetch(u),j=await r.json(),a=Object.values(j.query?.pages||{}).filter(x=>x.title.toLowerCase().endsWith('.svg')&&x.imageinfo);$('clipResults').innerHTML=a.length?a.map(x=>`<img alt="Klipart" src="${esc(x.imageinfo[0].thumburl||x.imageinfo[0].url)}" data-url="${esc(x.imageinfo[0].thumburl||x.imageinfo[0].url)}">`).join(''):'<div class="small">Klipart nenalezen.</div>'}catch{$('clipResults').innerHTML='';toast('Kliparty se nepodařilo načíst')}};$('clipResults').onclick=e=>{if(e.target.tagName==='IMG'){$('image').value=e.target.dataset.url||e.target.src;document.querySelectorAll('#clipResults img').forEach(x=>x.classList.remove('selected'));e.target.classList.add('selected');$('removeClip').style.display='block'}};$('clipFile').onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.size>1000000)return toast('Maximum je 1 MB');let r=new FileReader();r.onload=()=>{$('image').value=r.result;$('clipResults').innerHTML=`<img class="selected" src="${r.result}" alt="Vlastní klipart">`;$('removeClip').style.display='block'};r.readAsDataURL(f)};$('removeClip').onclick=()=>{$('image').value='';$('clipResults').innerHTML='';$('removeClip').style.display='none'};
function renderList(){let q=$('search').value.toLowerCase(),t=$('listType').value,a=words.filter(w=>(!q||(w.word+' '+w.translation).toLowerCase().includes(q))&&(t==='Všechny slovní druhy'||w.type===t));$('wordList').innerHTML=a.map(w=>`<div class="item"><div><b>${esc(w.word)} → ${esc(w.translation)}</b><div class="small">${esc(w.type)}${w.gender?' · '+(w.gender==='m'?'m.':'ž.')+' rod':''} · úroveň ${w.score||0}/5</div></div><div><button class="btn" data-edit="${w.id}" style="padding:7px 9px;width:auto" title="Upravit">✏️</button><button class="danger" data-id="${w.id}" title="Smazat">×</button></div></div>`).join('')||'<div class="small">Žádná slovíčka.</div>'}$('search').oninput=$('listType').onchange=renderList;function loadEdit(id){let w=words.find(x=>x.id===id);if(!w)return;editingId=id;$('word').value=w.word||'';$('translation').value=w.translation||'';$('type').value=w.type||'Ostatní';$('gender').value=w.gender||'';$('article').value=w.article||'';$('plural').value=w.plural||'';$('image').value=w.image||'';$('note').value=w.note||'';$('isc').checked=!!w.isIsc;let c=w.conjugation||{};['io','tu','lui','noi','voi','loro'].forEach(x=>$(x).value=c[x]||'');toggleBoxes();$('clipResults').innerHTML=w.image?'<img class="selected" src="'+esc(w.image)+'" alt="Klipart">':'';$('removeClip').style.display=w.image?'block':'none';document.querySelector('[data-tab="add"]').click();$('form').querySelector('h2').textContent='Upravit slovíčko';$('form').querySelector('button[type="submit"]').textContent='Uložit změny';window.scrollTo({top:0,behavior:'smooth'})}function resetEditForm(){editingId=null;$('form').reset();$('type').value='Podstatné jméno';toggleBoxes();$('clipResults').innerHTML='';$('removeClip').style.display='none';$('form').querySelector('h2').textContent='Nové slovíčko';$('form').querySelector('button[type="submit"]').textContent='Uložit slovíčko'}
$('wordList').onclick=e=>{if(e.target.dataset.edit){loadEdit(e.target.dataset.edit);return}if(e.target.dataset.id&&confirm('Smazat?')){words=words.filter(w=>w.id!==e.target.dataset.id);save();renderList();next()}};
$('form').onsubmit=e=>{e.preventDefault();let c=$('type').value==='Sloveso'?Object.fromEntries(['io','tu','lui','noi','voi','loro'].map(x=>[x,$(x).value.trim()])):null;let data={word:$('word').value.trim(),translation:$('translation').value.trim(),type:$('type').value,gender:$('gender').value,article:$('article').value.trim(),plural:$('plural').value.trim(),isIsc:$('isc').checked,conjugation:c,image:$('image').value,note:$('note').value.trim()};if(editingId){let i=words.findIndex(w=>w.id===editingId);if(i>=0)words[i]={...words[i],...data};toast('Změny uloženy')}else{words.push({id:crypto.randomUUID(),...data,score:0});toast('Slovíčko uloženo')}save();resetEditForm();renderList();next()};
function pool(){return words.filter(w=>$('learnType').value==='Všechny slovní druhy'||w.type===$('learnType').value)}function next(){let a=pool();revealed=false;reverse=$('direction').value==='cs-it'||($('direction').value==='random'&&Math.random()<.5);if(!a.length){current=null;$('front').textContent='Žádná slovíčka';$('back').textContent='';stats();return}let p=[];a.forEach(w=>{for(let i=0;i<Math.max(1,6-(w.score||0));i++)p.push(w)});current=p[Math.floor(Math.random()*p.length)];draw();stats()}function draw(){if(!current)return;$('front').textContent=reverse?current.translation:current.word;let ans=reverse?current.word:current.translation,details='';if(current.type==='Podstatné jmé')details='';if(current.type==='Podstatné jmé' || current.type==='Podstatné jméno')details=(current.article?' '+current.article+' '+current.word:'')+(current.plural?' · mn. '+current.plural:'');if(current.type==='Sloveso'&&current.conjugation)details='<br><span class="small">io '+esc(current.conjugation.io)+' · tu '+esc(current.conjugation.tu)+' · Lui/Lei '+esc(current.conjugation.lui)+' · noi '+esc(current.conjugation.noi)+' · voi '+esc(current.conjugation.voi)+' · loro '+esc(current.conjugation.loro)+'</span>';$('back').innerHTML=revealed?esc(ans)+details:'';$('meta').textContent=current.type+' · '+(reverse?'čeština → italština':'italština → čeština');$('hint').textContent=revealed?'Vyber hodnocení':'Klepni pro odpověď';if(current.image){$('cardClip').src=current.image;$('cardClip').style.display='block'}else $('cardClip').style.display='none';$('dict').href='https://it.wiktionary.org/wiki/'+encodeURIComponent(current.word)}function rate(ok){if(!current)return;current.score=Math.max(0,Math.min(5,(current.score||0)+(ok?1:-1)));series=ok?series+1:0;localStorage.setItem('linguo7streak',series);save();next();renderList()}function stats(){$('count').textContent=words.length;$('known').textContent=words.filter(w=>(w.score||0)>=3).length;$('streak').textContent=series}$('flash').onclick=()=>{if(current){revealed=!revealed;draw()}};$('know').onclick=()=>rate(true);$('again').onclick=()=>rate(false);$('learnType').onchange=$('direction').onchange=next;$('speak').onclick=()=>{if(!current)return;let u=new SpeechSynthesisUtterance(current.word);u.lang='it-IT';speechSynthesis.cancel();speechSynthesis.speak(u)};
function download(n,s,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;a.click();URL.revokeObjectURL(a.href)}$('exportJson').onclick=()=>download('linguo-v7-zaloha.json',JSON.stringify({version:7,words},null,2),'application/json');$('exportCsv').onclick=()=>{let h=['word','translation','type','gender','article','plural','note','image'],rows=[h,...words.map(w=>h.map(k=>'"'+String(w[k]||'').replaceAll('"','""')+'"'))];download('linguo-v7.csv','\ufeff'+rows.map(r=>r.join(';')).join('\n'),'text/csv')};$('importFile').onchange=async e=>{try{let j=JSON.parse(await e.target.files[0].text()),a=j.words||j;if(!Array.isArray(a))throw Error();words=a;save();renderList();next();toast('Importováno')}catch{toast('Neplatná záloha')}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');renderList();next();
</script></body></html>
