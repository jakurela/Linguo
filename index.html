const $=x=>document.getElementById(x),T=['Všechny slovní druhy','Podstatné jméno','Sloveso','Přídavné jméno','Příslovce','Zájmeno','Předložka','Spojka','Fráze','Ostatní'],P=[['io','já'],['tu','ty'],['lui','Lui/Lei'],['noi','my'],['voi','vy'],['loro','oni/ony']];let words=JSON.parse(localStorage.getItem('linguo9')||localStorage.getItem('linguo7')||'[]'),cur=null,rev=false,reveal=false,editing=null,deferredPrompt=null,game=null;const save=()=>localStorage.setItem('linguo9',JSON.stringify(words)),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),norm=s=>String(s||'').trim().toLocaleLowerCase('it-IT').normalize('NFD').replace(/[\u0300-\u036f]/g,''),toast=t=>{let e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)};['learnType','type'].forEach(id=>$(id).innerHTML=T.map((x,i)=>id==='type'&&i===0?'':`<option>${x}</option>`).join(''));$('type').value='Podstatné jméno';document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active');if(b.dataset.tab==='verbs')refreshVerbs()});

const irr={essere:['sono','sei','è','siamo','siete','sono'],avere:['ho','hai','ha','abbiamo','avete','hanno'],andare:['vado','vai','va','andiamo','andate','vanno'],fare:['faccio','fai','fa','facciamo','fate','fanno'],stare:['sto','stai','sta','stiamo','state','stanno'],dire:['dico','dici','dice','diciamo','dite','dicono'],venire:['vengo','vieni','viene','veniamo','venite','vengono'],potere:['posso','puoi','può','possiamo','potete','possono'],volere:['voglio','vuoi','vuole','vogliamo','volete','vogliono'],dovere:['devo','devi','deve','dobbiamo','dovete','devono']};function conjugate(){let v=$('word').value.toLowerCase(),a=irr[v],s;if(!a){if(/are$/.test(v)){s=v.slice(0,-3);a=['o','i','a','iamo','ate','ano']}else if(/ere$/.test(v)){s=v.slice(0,-3);a=['o','i','e','iamo','ete','ono']}else if(/ire$/.test(v)){s=v.slice(0,-3);a=$('isc').checked?['isco','isci','isce','iamo','ite','iscono']:['o','i','e','iamo','ite','ono'];}if(a&&s)a=a.map(x=>s+x)}if(!a)return toast('Infinitiv nebyl rozpoznán');P.forEach((p,i)=>$(p[0]).value=a[i])}$('conj').onclick=conjugate;$('isc').onchange=conjugate;function toggle(){$('noun').style.display=$('type').value==='Podstatné jméno'?'block':'none';$('verb').style.display=$('type').value==='Sloveso'?'block':'none'}$('type').onchange=toggle;toggle();function reset(){editing=null;$('form').reset();$('type').value='Podstatné jméno';toggle();$('formTitle').textContent='Nové slovíčko';$('saveBtn').textContent='Uložit slovíčko'}$('form').onsubmit=e=>{e.preventDefault();let c=$('type').value==='Sloveso'?Object.fromEntries(P.map(x=>[x[0],$(x[0]).value.trim()])):null,d={word:$('word').value.trim(),translation:$('translation').value.trim(),type:$('type').value,gender:$('gender').value,article:$('article').value,plural:$('plural').value,isIsc:$('isc').checked,conjugation:c,note:$('note').value};if(editing){let i=words.findIndex(w=>w.id===editing);words[i]={...words[i],...d}}else words.push({id:crypto.randomUUID(),...d,score:0});save();reset();render();next()
